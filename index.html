<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Positivity Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Candle flicker overlay -->
  <div class="candle-glow"></div>

  <!-- Main journal content -->
  <div class="container">
    <h1>Positivity Journal</h1>
    <p class="quote" id="dailyQuote">Loading quote...</p>

    <textarea id="entryInput" placeholder="Type your reflection here..."></textarea>
    <button onclick="addEntry()">Save Entry</button>
    <button onclick="toggleEntries()">Show Past Entries</button>

    <div id="entriesContainer" class="entries hidden"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
